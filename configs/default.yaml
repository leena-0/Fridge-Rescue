project:
  name: Fridge Rescue
  random_seed: 42

paths:
  raw_data_dir: data/raw
  processed_data_dir: data/processed
  model_dir: models
  output_dir: outputs

datasets:
  foodcom:
    recipes: data/raw/foodcom/RAW_recipes.csv
    interactions: data/raw/foodcom/RAW_interactions.csv
  recipenlg:
    recipes: data/raw/recipenlg/full_dataset.csv

eda:
  default_max_rows: 100000
  histogram_bins: 40

preprocessing:
  default_max_rows: 100000
  audit_sample_size: 50
  ingredient_synonyms: configs/ingredient_synonyms.yaml

splitting:
  min_train_user_interactions: 5
  min_train_recipe_interactions: 5

recommendation:
  default_top_k: 10
  max_top_k: 50
