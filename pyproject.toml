[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fridge-rescue"
version = "0.1.0"
description = "Ingredient-aware recipe recommendation system"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "streamlit>=1.39",
]

[project.optional-dependencies]
eda = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fridge_rescue"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
